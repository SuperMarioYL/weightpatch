<svg class="weightpatch-terminal" viewBox="0 0 801 524" width="801" height="524" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>weightpatch screen: two edited tensors kept in a Q8_0 GGUF</title>
  <desc>Terminal recording of weightpatch diff and weightpatch screen. The diff finds two BF16 slice edits; screen maps their safetensors names to GGML names and reverses the GGUF ne shape, reporting 2 kept, 0 missing, 0 reshaped.</desc>
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="801" height="524" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect x="0" y="0" width="801" height="524" rx="12" fill="#0d1117"/>
    <rect x="0" y="0" width="801" height="38" fill="#161b22"/>
    <rect x="0" y="37" width="801" height="1" fill="#21262d"/>
    <circle cx="20" cy="19" r="5" fill="#f87171"/><circle cx="38" cy="19" r="5" fill="#e3b341"/><circle cx="56" cy="19" r="5" fill="#3fb950"/>
    <text x="400.5" y="24" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12">weightpatch 0.1.0 — diff, then screen</text>
    <rect x="0" y="38" width="801" height="486" fill="#0d1117"/>
    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13px" xml:space="preserve">
      <text x="22" y="71" xml:space="preserve"><tspan fill="#56d364" font-weight="600">$ </tspan><tspan fill="#e6edf3" font-weight="600">weightpatch diff ./Qwen3-0.6B ./Qwen3-0.6B-neurons -o qwen3-0.6b-neurons.wpatch</tspan></text><text x="22" y="91" xml:space="preserve"><tspan fill="#c9d1d9">base    Qwen3-0.6B</tspan></text><text x="22" y="111" xml:space="preserve"><tspan fill="#c9d1d9">target  Qwen3-0.6B-neurons</tspan></text><text x="22" y="151" xml:space="preserve"><tspan fill="#c9d1d9" font-weight="600">tensor                                </tspan><tspan fill="#c9d1d9" font-weight="600"> </tspan><tspan fill="#c9d1d9" font-weight="600"> </tspan><tspan fill="#c9d1d9" font-weight="600">dtype</tspan><tspan fill="#c9d1d9" font-weight="600"> </tspan><tspan fill="#c9d1d9" font-weight="600"> </tspan><tspan fill="#c9d1d9" font-weight="600">    shape</tspan><tspan fill="#c9d1d9" font-weight="600"> </tspan><tspan fill="#c9d1d9" font-weight="600"> </tspan><tspan fill="#c9d1d9" font-weight="600">slice              </tspan><tspan fill="#c9d1d9" font-weight="600"> </tspan><tspan fill="#c9d1d9" font-weight="600"> </tspan><tspan fill="#c9d1d9" font-weight="600">before  </tspan><tspan fill="#c9d1d9" font-weight="600"> </tspan><tspan fill="#c9d1d9" font-weight="600"> </tspan><tspan fill="#c9d1d9" font-weight="600">after   </tspan></text><text x="22" y="171" xml:space="preserve"><tspan fill="#c9d1d9">model.layers.0.self_attn.q_proj.weight  BF16   2048×1024  [0:0:64] [1:0:1024] </tspan><tspan fill="#8b949e"> </tspan><tspan fill="#8b949e">d60fe4d8</tspan><tspan fill="#8b949e"> </tspan><tspan fill="#8b949e"> </tspan><tspan fill="#8b949e">3369ebd6</tspan></text><text x="22" y="191" xml:space="preserve"><tspan fill="#c9d1d9">model.layers.12.mlp.down_proj.weight    BF16   1024×3072  [0:0:64] [1:0:3072] </tspan><tspan fill="#8b949e"> </tspan><tspan fill="#8b949e">dd3f83f2</tspan><tspan fill="#8b949e"> </tspan><tspan fill="#8b949e"> </tspan><tspan fill="#8b949e">be3fb25d</tspan></text><text x="22" y="211" xml:space="preserve"><tspan fill="#c9d1d9">2 changed · 2 unchanged · 0 added · 0 removed</tspan></text><text x="22" y="231" xml:space="preserve"><tspan fill="#c9d1d9">patch   qwen3-0.6b-neurons.wpatch · 8e03e6697c2a</tspan></text><text x="22" y="271" xml:space="preserve"><tspan fill="#56d364" font-weight="600">$ </tspan><tspan fill="#e6edf3" font-weight="600">weightpatch screen Qwen3-0.6B-Q8_0.gguf qwen3-0.6b-neurons.wpatch</tspan></text><text x="22" y="291" xml:space="preserve"><tspan fill="#c9d1d9">Qwen3-0.6B-Q8_0.gguf · gguf · arch qwen3</tspan></text><text x="22" y="331" xml:space="preserve"><tspan fill="#56d364">kept             model.layers.0.self_attn.q_proj.weight</tspan></text><text x="22" y="351" xml:space="preserve"><tspan fill="#8b949e">                 present as &#x27;blk.0.attn_q.weight&#x27;; raw ne 1024×2048 reverses to the recorded</tspan></text><text x="22" y="371" xml:space="preserve"><tspan fill="#8b949e">                 2048×1024 (values not compared)</tspan></text><text x="22" y="391" xml:space="preserve"><tspan fill="#56d364">kept             model.layers.12.mlp.down_proj.weight</tspan></text><text x="22" y="411" xml:space="preserve"><tspan fill="#8b949e">                 present as &#x27;blk.12.ffn_down.weight&#x27;; raw ne 3072×1024 reverses to the recorded</tspan></text><text x="22" y="431" xml:space="preserve"><tspan fill="#8b949e">                 1024×3072 (values not compared)</tspan></text><text x="22" y="471" xml:space="preserve"><tspan fill="#c9d1d9">2 kept · 0 missing · 0 reshaped</tspan></text>
    </g>
    <text x="22" y="508" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11">real run on a synthetic Qwen3-0.6B-shaped fixture (4 tensors, 2 slice edits); no model download</text>
  </g>
  <rect x="0.5" y="0.5" width="800" height="523" rx="12" fill="none" stroke="#30363d"/>
