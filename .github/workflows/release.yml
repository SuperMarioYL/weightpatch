name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel and the sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Write checksums
        run: cd dist && sha256sum ./*.whl ./*.tar.gz > checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  # Opt-in: a fresh repo has no PyPI Trusted Publisher registered, so this job
  # stays skipped until the repository variable PYPI_PUBLISH is set to "true".
  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
