<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" data-palette="e656bb-e76a7f-f1acf6-3561becb8244" role="img" aria-labelledby="architecture-dark.svg-title architecture-dark.svg-desc"><title id="architecture-dark.svg-title">weightpatch architecture: one process, five modules</title><desc id="architecture-dark.svg-desc">cli.py is the typer command layer. checkpoint.py parses the safetensors header and reads byte ranges with per-tensor digests. diff.py compares raw words and records bounding-box slices. patch.py owns the content-addressed id, apply, revert, stack and pre-image checks. screen.py compares safetensors bytes or maps GGUF names and reverses the ne order. There is no server, database or network call.</desc><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e656bb"/><stop offset=".55" stop-color="#e76a7f"/><stop offset="1" stop-color="#f1acf6"/></linearGradient><linearGradient id="cool" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e76a7f" stop-opacity=".30"/><stop offset="1" stop-color="#e656bb" stop-opacity=".05"/></linearGradient><radialGradient id="halo"><stop stop-color="#e656bb" stop-opacity="0.2"/><stop offset="1" stop-color="#e656bb" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3a1836" stroke-opacity=".5" stroke-width=".7"/></pattern><filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#e656bb" stroke-width="1.6"/></marker></defs><style>
.flow{stroke-dasharray:8 14;animation:flow 6s linear infinite}
.pulse{animation:pulse 5s ease-in-out infinite}
.trace{animation:trace 7s linear infinite}
@keyframes flow{to{stroke-dashoffset:-176}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes trace{0%{opacity:0}12%,88%{opacity:.65}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.flow,.pulse,.trace{animation:none}}
</style><rect width="1000" height="580" rx="16" fill="#0a0710"/><rect width="1000" height="580" rx="16" fill="url(#grid)" opacity="0.55"/><ellipse cx="620" cy="208.79999999999998" rx="500" ry="348" fill="url(#halo)"/><text x="44" y="44" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12" fill="#b29cbc" font-weight="400" text-anchor="start" opacity="1">ARCHITECTURE / ONE PROCESS, FIVE MODULES</text><text x="44" y="82" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="24" fill="#fceefd" font-weight="400" text-anchor="start" opacity="1">cli.py · checkpoint.py · diff.py · patch.py · screen.py</text><text x="40" y="120" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#b29cbc" font-weight="400" text-anchor="start" opacity="1">YOU BRING</text><text x="320" y="120" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#b29cbc" font-weight="400" text-anchor="start" opacity="1">MODULES</text><text x="660" y="120" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#b29cbc" font-weight="400" text-anchor="start" opacity="1">ARTIFACTS</text><rect x="40" y="140" width="210" height="76" rx="12" fill="#13101c" stroke="#3a1836" stroke-width="1.1" opacity="1"/><text x="56" y="168" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#fceefd" font-weight="600" text-anchor="start" opacity="1">base + edited dirs</text><text x="56" y="192" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#b29cbc" font-weight="400" text-anchor="start" opacity="1">safetensors · 311 tensors</text><rect x="40" y="240" width="210" height="76" rx="12" fill="#13101c" stroke="#3a1836" stroke-width="1.1" opacity="1"/><text x="56" y="268" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#fceefd" font-weight="600" text-anchor="start" opacity="1">.wpatch</text><text x="56" y="292" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#b29cbc" font-weight="400" text-anchor="start" opacity="1">manifest + raw slices</text><rect x="40" y="340" width="210" height="76" rx="12" fill="#13101c" stroke="#3a1836" stroke-width="1.1" opacity="1"/><text x="56" y="368" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#fceefd" font-weight="600" text-anchor="start" opacity="1">single-file .gguf</text><text x="56" y="392" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#b29cbc" font-weight="400" text-anchor="start" opacity="1">arch + block_count</text><rect x="320" y="130" width="270" height="62" rx="12" fill="#13101c" stroke="#3a1836" stroke-width="1.1" opacity="1"/><text x="336" y="155" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13.5" fill="#e656bb" font-weight="600" text-anchor="start" opacity="1">cli.py</text><text x="336" y="176" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#b29cbc" font-weight="400" text-anchor="start" opacity="1">six commands · --json · exit codes</text><path d="M455 192L455 206" fill="none" stroke="#e656bb" stroke-width="1.5" stroke-opacity="1" marker-end="url(#arrow)"/><rect x="320" y="208" width="270" height="62" rx="12" fill="#13101c" stroke="#3a1836" stroke-width="1.1" opacity="1"/><text x="336" y="233" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13.5" fill="#e656bb" font-weight="600" text-anchor="start" opacity="1">checkpoint.py</text><text x="336" y="254" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#b29cbc" font-weight="400" text-anchor="start" opacity="1">header parse · byte ranges · digests</text><path d="M455 270L455 284" fill="none" stroke="#e656bb" stroke-width="1.5" stroke-opacity="1" marker-end="url(#arrow)"/><rect x="320" y="286" width="270" height="62" rx="12" fill="#13101c" stroke="#3a1836" stroke-width="1.1" opacity="1"/><text x="336" y="311" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13.5" fill="#e656bb" font-weight="600" text-anchor="start" opacity="1">diff.py</text><text x="336" y="332" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#b29cbc" font-weight="400" text-anchor="start" opacity="1">raw-word compare · bbox slices</text><path d="M455 348L455 362" fill="none" stroke="#e656bb" stroke-width="1.5" stroke-opacity="1" marker-end="url(#arrow)"/><rect x="320" y="364" width="270" height="62" rx="12" fill="#13101c" stroke="#3a1836" stroke-width="1.1" opacity="1"/><text x="336" y="389" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13.5" fill="#e656bb" font-weight="600" text-anchor="start" opacity="1">patch.py</text><text x="336" y="410" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#b29cbc" font-weight="400" text-anchor="start" opacity="1">id · apply/revert/stack · pre-image</text><path d="M455 426L455 440" fill="none" stroke="#e656bb" stroke-width="1.5" stroke-opacity="1" marker-end="url(#arrow)"/><rect x="320" y="442" width="270" height="62" rx="12" fill="#13101c" stroke="#e656bb" stroke-width="1.4" opacity="1"/><text x="336" y="467" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13.5" fill="#e656bb" font-weight="600" text-anchor="start" opacity="1">screen.py</text><text x="336" y="488" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#b29cbc" font-weight="400" text-anchor="start" opacity="1">safetensors bytes · GGUF name map</text><rect x="660" y="130" width="300" height="62" rx="12" fill="#140d1a" stroke="#3a1836" stroke-width="1.1" opacity="1"/><text x="676" y="155" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#fceefd" font-weight="600" text-anchor="start" opacity="1">base manifest</text><text x="676" y="176" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#b29cbc" font-weight="400" text-anchor="start" opacity="1">shard names · bytes · sha256</text><rect x="660" y="208" width="300" height="62" rx="12" fill="#140d1a" stroke="#3a1836" stroke-width="1.1" opacity="1"/><text x="676" y="233" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#fceefd" font-weight="600" text-anchor="start" opacity="1">tensor digests</text><text x="676" y="254" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#b29cbc" font-weight="400" text-anchor="start" opacity="1">before_sha256 · after_sha256</text><rect x="660" y="286" width="300" height="62" rx="12" fill="#140d1a" stroke="#3a1836" stroke-width="1.1" opacity="1"/><text x="676" y="311" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#fceefd" font-weight="600" text-anchor="start" opacity="1">.wpatch</text><text x="676" y="332" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#b29cbc" font-weight="400" text-anchor="start" opacity="1">manifest.json + values.npz</text><rect x="660" y="364" width="300" height="62" rx="12" fill="#140d1a" stroke="#3a1836" stroke-width="1.1" opacity="1"/><text x="676" y="389" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#fceefd" font-weight="600" text-anchor="start" opacity="1">output checkpoint</text><text x="676" y="410" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#b29cbc" font-weight="400" text-anchor="start" opacity="1">tensor shards only</text><rect x="660" y="442" width="300" height="62" rx="12" fill="#140d1a" stroke="#3a1836" stroke-width="1.1" opacity="1"/><text x="676" y="467" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#fceefd" font-weight="600" text-anchor="start" opacity="1">ScreenReport</text><text x="676" y="488" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#b29cbc" font-weight="400" text-anchor="start" opacity="1">kept · missing · reshaped</text><path d="M250 178H284V211H318" fill="none" stroke="#e656bb" stroke-width="1.2" stroke-opacity="0.8" marker-end="url(#arrow)"/><path d="M250 278H284V389H318" fill="none" stroke="#e76a7f" stroke-width="1.2" stroke-opacity="0.8" marker-end="url(#arrow)"/><path d="M250 378H284V467H318" fill="none" stroke="#e76a7f" stroke-width="1.2" stroke-opacity="0.8" marker-end="url(#arrow)"/><path d="M590 161H624V161H658" fill="none" stroke="#e656bb" stroke-width="1.2" stroke-opacity="0.8" marker-end="url(#arrow)"/><path d="M590 239H624V239H658" fill="none" stroke="#e656bb" stroke-width="1.2" stroke-opacity="0.8" marker-end="url(#arrow)"/><path d="M590 317H624V317H658" fill="none" stroke="#e656bb" stroke-width="1.2" stroke-opacity="0.8" marker-end="url(#arrow)"/><path d="M590 395H624V395H658" fill="none" stroke="#e656bb" stroke-width="1.2" stroke-opacity="0.8" marker-end="url(#arrow)"/><path d="M590 473H624V473H658" fill="none" stroke="#e656bb" stroke-width="1.2" stroke-opacity="0.8" marker-end="url(#arrow)"/><text x="40" y="540" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#b29cbc" font-weight="400" text-anchor="start" opacity="1">state lives only in arguments and output directories  ·  no server, database or network call</text><text x="40" y="564" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#b29cbc" font-weight="400" text-anchor="start" opacity="1">a patch applies to any base whose touched tensors still match before_sha256</text></svg>
