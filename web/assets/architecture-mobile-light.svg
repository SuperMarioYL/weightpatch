<svg xmlns="http://www.w3.org/2000/svg" width="520" height="820" viewBox="0 0 520 820" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" data-palette="e656bb-e76a7f-f1acf6-3561becb8244" role="img" aria-labelledby="architecture-mobile-light.svg-title architecture-mobile-light.svg-desc"><title id="architecture-mobile-light.svg-title">weightpatch architecture: one process, five modules</title><desc id="architecture-mobile-light.svg-desc">cli.py is the typer command layer. checkpoint.py parses the safetensors header and reads byte ranges with per-tensor digests. diff.py compares raw words and records bounding-box slices. patch.py owns the content-addressed id, apply, revert, stack and pre-image checks. screen.py compares safetensors bytes or maps GGUF names and reverses the ne order. There is no server, database or network call.</desc><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b74595"/><stop offset=".55" stop-color="#b35263"/><stop offset="1" stop-color="#8b638e"/></linearGradient><linearGradient id="cool" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b35263" stop-opacity=".30"/><stop offset="1" stop-color="#b74595" stop-opacity=".05"/></linearGradient><radialGradient id="halo"><stop stop-color="#b74595" stop-opacity="0.11"/><stop offset="1" stop-color="#b74595" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f7cbeb" stroke-opacity=".5" stroke-width=".7"/></pattern><filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#b74595" stroke-width="1.6"/></marker></defs><style>
.flow{stroke-dasharray:8 14;animation:flow 6s linear infinite}
.pulse{animation:pulse 5s ease-in-out infinite}
.trace{animation:trace 7s linear infinite}
@keyframes flow{to{stroke-dashoffset:-176}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes trace{0%{opacity:0}12%,88%{opacity:.65}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.flow,.pulse,.trace{animation:none}}
</style><rect width="520" height="820" rx="16" fill="#fef9fd"/><rect width="520" height="820" rx="16" fill="url(#grid)" opacity="0.8"/><ellipse cx="322.4" cy="295.2" rx="260" ry="492" fill="url(#halo)"/><text x="28" y="38" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">ARCHITECTURE / FIVE MODULES</text><text x="28" y="74" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="22" fill="#27162a" font-weight="400" text-anchor="start" opacity="1">One process, five modules,</text><text x="28" y="100" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="22" fill="#27162a" font-weight="400" text-anchor="start" opacity="1">no service in the middle</text><text x="28" y="132" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">you bring</text><rect x="28" y="144" width="464" height="46" rx="12" fill="#fef7fc" stroke="#f7cbeb" stroke-width="1.1" opacity="1"/><text x="42" y="164" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#27162a" font-weight="600" text-anchor="start" opacity="1">base + edited dirs</text><text x="42" y="181" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">safetensors, single or sharded</text><rect x="28" y="198" width="464" height="46" rx="12" fill="#fef7fc" stroke="#f7cbeb" stroke-width="1.1" opacity="1"/><text x="42" y="218" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#27162a" font-weight="600" text-anchor="start" opacity="1">.wpatch</text><text x="42" y="235" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">manifest + raw slices</text><rect x="28" y="252" width="464" height="46" rx="12" fill="#fef7fc" stroke="#f7cbeb" stroke-width="1.1" opacity="1"/><text x="42" y="272" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#27162a" font-weight="600" text-anchor="start" opacity="1">single-file .gguf</text><text x="42" y="289" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">architecture + block_count</text><path d="M260 302L260 320" fill="none" stroke="#b74595" stroke-width="1.5" stroke-opacity="1" marker-end="url(#arrow)"/><text x="28" y="340" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">modules</text><rect x="28" y="352" width="464" height="56" rx="12" fill="#fef7fc" stroke="#f7cbeb" stroke-width="1.1" opacity="1"/><text x="42" y="375" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#b74595" font-weight="600" text-anchor="start" opacity="1">cli.py</text><text x="42" y="395" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">six commands · --json · exit codes</text><rect x="28" y="418" width="464" height="56" rx="12" fill="#fef7fc" stroke="#f7cbeb" stroke-width="1.1" opacity="1"/><text x="42" y="441" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#b74595" font-weight="600" text-anchor="start" opacity="1">checkpoint.py</text><text x="42" y="461" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">header parse · byte ranges · digests</text><rect x="28" y="484" width="464" height="56" rx="12" fill="#fef7fc" stroke="#f7cbeb" stroke-width="1.1" opacity="1"/><text x="42" y="507" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#b74595" font-weight="600" text-anchor="start" opacity="1">diff.py</text><text x="42" y="527" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">raw-word compare · bbox slices</text><rect x="28" y="550" width="464" height="56" rx="12" fill="#fef7fc" stroke="#f7cbeb" stroke-width="1.1" opacity="1"/><text x="42" y="573" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#b74595" font-weight="600" text-anchor="start" opacity="1">patch.py</text><text x="42" y="593" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">id · apply/revert/stack · pre-image</text><rect x="28" y="616" width="464" height="56" rx="12" fill="#fef7fc" stroke="#b74595" stroke-width="1.1" opacity="1"/><text x="42" y="639" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#b74595" font-weight="600" text-anchor="start" opacity="1">screen.py</text><text x="42" y="659" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">safetensors bytes · GGUF name map</text><text x="28" y="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">artifacts</text><rect x="28" y="712" width="464" height="56" rx="12" fill="#fdf3fa" stroke="#f7cbeb" stroke-width="1.1" opacity="1"/><text x="42" y="735" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12" fill="#27162a" font-weight="600" text-anchor="start" opacity="1">.wpatch  ·  output checkpoint</text><text x="42" y="755" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">base manifest · ScreenReport</text><text x="28" y="792" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">no server, database or network · state only in arguments and outputs</text></svg>
