<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" data-palette="e656bb-e76a7f-f1acf6-3561becb8244" role="img" aria-labelledby="integrations-light.svg-title integrations-light.svg-desc"><title id="integrations-light.svg-title">weightpatch capabilities and required inputs</title><desc id="integrations-light.svg-desc">Shipped in v0.1: six commands (diff, show, apply, revert, stack, screen), sparse bounding-box slices, a content-addressed id over base, parents and edit, pre-image and post-image verification, byte-identical revert, slice-overlap refusal, a GGUF name map with reversed ne order, and JSON output for diff, show and screen. The operator supplies Python 3.12, a base safetensors directory, an edited directory, a .wpatch and, for a screen, one .gguf file.</desc><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b74595"/><stop offset=".55" stop-color="#b35263"/><stop offset="1" stop-color="#8b638e"/></linearGradient><linearGradient id="cool" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b35263" stop-opacity=".30"/><stop offset="1" stop-color="#b74595" stop-opacity=".05"/></linearGradient><radialGradient id="halo"><stop stop-color="#b74595" stop-opacity="0.11"/><stop offset="1" stop-color="#b74595" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f7cbeb" stroke-opacity=".5" stroke-width=".7"/></pattern><filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#b74595" stroke-width="1.6"/></marker></defs><style>
.flow{stroke-dasharray:8 14;animation:flow 6s linear infinite}
.pulse{animation:pulse 5s ease-in-out infinite}
.trace{animation:trace 7s linear infinite}
@keyframes flow{to{stroke-dashoffset:-176}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes trace{0%{opacity:0}12%,88%{opacity:.65}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.flow,.pulse,.trace{animation:none}}
</style><rect width="1000" height="470" rx="16" fill="#fef9fd"/><rect width="1000" height="470" rx="16" fill="url(#grid)" opacity="0.8"/><ellipse cx="620" cy="169.2" rx="500" ry="282" fill="url(#halo)"/><text x="44" y="44" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">CAPABILITIES / WHAT SHIPS, WHAT YOU BRING</text><text x="44" y="82" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="27" fill="#27162a" font-weight="400" text-anchor="start" opacity="1">Six commands and a patch that fits in a zip</text><text x="40" y="120" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">YOU BRING</text><text x="660" y="120" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">SHIPPED IN v0.1</text><rect x="40" y="136" width="300" height="52" rx="12" fill="#fef7fc" stroke="#f7cbeb" stroke-width="1.1" opacity="1"/><text x="54" y="157" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#27162a" font-weight="600" text-anchor="start" opacity="1">Python 3.12</text><text x="54" y="176" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">no GPU, no PyTorch</text><rect x="40" y="198" width="300" height="52" rx="12" fill="#fef7fc" stroke="#f7cbeb" stroke-width="1.1" opacity="1"/><text x="54" y="219" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#27162a" font-weight="600" text-anchor="start" opacity="1">base directory</text><text x="54" y="238" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">safetensors, single or sharded</text><rect x="40" y="260" width="300" height="52" rx="12" fill="#fef7fc" stroke="#f7cbeb" stroke-width="1.1" opacity="1"/><text x="54" y="281" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#27162a" font-weight="600" text-anchor="start" opacity="1">edited directory</text><text x="54" y="300" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">any derivative of that base</text><rect x="40" y="322" width="300" height="52" rx="12" fill="#fef7fc" stroke="#f7cbeb" stroke-width="1.1" opacity="1"/><text x="54" y="343" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#27162a" font-weight="600" text-anchor="start" opacity="1">a .wpatch</text><text x="54" y="362" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">written by diff</text><rect x="40" y="384" width="300" height="52" rx="12" fill="#fef7fc" stroke="#f7cbeb" stroke-width="1.1" opacity="1"/><text x="54" y="405" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#27162a" font-weight="600" text-anchor="start" opacity="1">one .gguf</text><text x="54" y="424" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">only for screen</text><rect x="390" y="168" width="220" height="148" rx="12" fill="#fdf3fa" stroke="#b74595" stroke-width="1.5" opacity="1"/><text x="406" y="198" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="18" fill="#b74595" font-weight="600" text-anchor="start" opacity="1">weightpatch</text><text x="406" y="226" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12" fill="#27162a" font-weight="400" text-anchor="start" opacity="1">diff  ·  show  ·  apply</text><text x="406" y="248" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12" fill="#27162a" font-weight="400" text-anchor="start" opacity="1">revert  ·  stack  ·  screen</text><text x="406" y="276" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">one Python process</text><text x="406" y="298" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">no server or database</text><line x1="340" y1="162" x2="350" y2="162" stroke="#f7cbeb" stroke-width="1" stroke-opacity="1"/><line x1="340" y1="224" x2="350" y2="224" stroke="#f7cbeb" stroke-width="1" stroke-opacity="1"/><line x1="340" y1="286" x2="350" y2="286" stroke="#f7cbeb" stroke-width="1" stroke-opacity="1"/><line x1="340" y1="348" x2="350" y2="348" stroke="#f7cbeb" stroke-width="1" stroke-opacity="1"/><line x1="340" y1="410" x2="350" y2="410" stroke="#f7cbeb" stroke-width="1" stroke-opacity="1"/><path d="M350 162V410" fill="none" stroke="#f7cbeb" stroke-width="1" stroke-dasharray="4 6"/><path d="M350 250L386 250" fill="none" stroke="#b35263" stroke-width="1.5" stroke-opacity="1" marker-end="url(#arrow)"/><path d="M612 242L650 242" fill="none" stroke="#b74595" stroke-width="1.5" stroke-opacity="1" marker-end="url(#arrow)"/><line x1="650" y1="162" x2="658" y2="162" stroke="#f7cbeb" stroke-width="1" stroke-opacity="1"/><line x1="650" y1="224" x2="658" y2="224" stroke="#f7cbeb" stroke-width="1" stroke-opacity="1"/><line x1="650" y1="286" x2="658" y2="286" stroke="#f7cbeb" stroke-width="1" stroke-opacity="1"/><line x1="650" y1="348" x2="658" y2="348" stroke="#f7cbeb" stroke-width="1" stroke-opacity="1"/><line x1="650" y1="410" x2="658" y2="410" stroke="#f7cbeb" stroke-width="1" stroke-opacity="1"/><path d="M650 162V410" fill="none" stroke="#f7cbeb" stroke-width="1" stroke-dasharray="4 6"/><rect x="660" y="136" width="145" height="52" rx="12" fill="#fef7fc" stroke="#f7cbeb" stroke-width="1.1" opacity="1"/><text x="672" y="157" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11.5" fill="#27162a" font-weight="600" text-anchor="start" opacity="1">sparse slices</text><text x="672" y="176" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">bbox only</text><rect x="815" y="136" width="145" height="52" rx="12" fill="#fef7fc" stroke="#f7cbeb" stroke-width="1.1" opacity="1"/><text x="827" y="157" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11.5" fill="#27162a" font-weight="600" text-anchor="start" opacity="1">content id</text><text x="827" y="176" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">sha256(base,parents,edit)</text><rect x="660" y="198" width="145" height="52" rx="12" fill="#fef7fc" stroke="#f7cbeb" stroke-width="1.1" opacity="1"/><text x="672" y="219" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11.5" fill="#27162a" font-weight="600" text-anchor="start" opacity="1">pre-image check</text><text x="672" y="238" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">before_sha256</text><rect x="815" y="198" width="145" height="52" rx="12" fill="#fef7fc" stroke="#f7cbeb" stroke-width="1.1" opacity="1"/><text x="827" y="219" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11.5" fill="#27162a" font-weight="600" text-anchor="start" opacity="1">post-image</text><text x="827" y="238" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">re-hash after write</text><rect x="660" y="260" width="145" height="52" rx="12" fill="#fef7fc" stroke="#f7cbeb" stroke-width="1.1" opacity="1"/><text x="672" y="281" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11.5" fill="#27162a" font-weight="600" text-anchor="start" opacity="1">byte-identical</text><text x="672" y="300" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">revert</text><rect x="815" y="260" width="145" height="52" rx="12" fill="#fef7fc" stroke="#f7cbeb" stroke-width="1.1" opacity="1"/><text x="827" y="281" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11.5" fill="#27162a" font-weight="600" text-anchor="start" opacity="1">slice overlap</text><text x="827" y="300" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">refused</text><rect x="660" y="322" width="145" height="52" rx="12" fill="#fef7fc" stroke="#f7cbeb" stroke-width="1.1" opacity="1"/><text x="672" y="343" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11.5" fill="#27162a" font-weight="600" text-anchor="start" opacity="1">GGUF name map</text><text x="672" y="362" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">ne reversed</text><rect x="815" y="322" width="145" height="52" rx="12" fill="#fef7fc" stroke="#f7cbeb" stroke-width="1.1" opacity="1"/><text x="827" y="343" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11.5" fill="#27162a" font-weight="600" text-anchor="start" opacity="1">--json</text><text x="827" y="362" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">diff · show · screen</text><line x1="40" y1="428" x2="960" y2="428" stroke="#f7cbeb" stroke-width="1" stroke-opacity="1"/><text x="40" y="452" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11" fill="#8b638e" font-weight="600" text-anchor="start" opacity="1">Not in v0.1:</text><text x="126" y="452" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">GGUF write · value compare · split GGUF · added/removed bytes · three-way merge · .bin · hosted service · signing</text></svg>
