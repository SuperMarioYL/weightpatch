<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" data-palette="e656bb-e76a7f-f1acf6-3561becb8244" role="img" aria-labelledby="demo-0-light.svg-title demo-0-light.svg-desc"><title id="demo-0-light.svg-title">The demo edit rewrites two BF16 slices</title><desc id="demo-0-light.svg-desc">make_demo_edit.py copies the base directory and flips bit 0x0080 in every raw BF16 word of the first 64 rows of two tensors. The edited copy has 311 tensors and the post-edit digests 574ebe3b4fcb427b for q_proj and b603bbfe2b46e3b9 for down_proj. No randomness and no float decoding are involved.</desc><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b74595"/><stop offset=".55" stop-color="#b35263"/><stop offset="1" stop-color="#8b638e"/></linearGradient><linearGradient id="cool" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b35263" stop-opacity=".30"/><stop offset="1" stop-color="#b74595" stop-opacity=".05"/></linearGradient><radialGradient id="halo"><stop stop-color="#b74595" stop-opacity="0.11"/><stop offset="1" stop-color="#b74595" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f7cbeb" stroke-opacity=".5" stroke-width=".7"/></pattern><filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#b74595" stroke-width="1.6"/></marker></defs><style>
.flow{stroke-dasharray:8 14;animation:flow 6s linear infinite}
.pulse{animation:pulse 5s ease-in-out infinite}
.trace{animation:trace 7s linear infinite}
@keyframes flow{to{stroke-dashoffset:-176}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes trace{0%{opacity:0}12%,88%{opacity:.65}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.flow,.pulse,.trace{animation:none}}
</style><rect width="760" height="300" rx="16" fill="#fef9fd"/><rect width="760" height="300" rx="16" fill="url(#grid)" opacity="0.8"/><ellipse cx="471.2" cy="108" rx="380" ry="180" fill="url(#halo)"/><text x="24" y="30" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">MAKE EDIT / BYTE-LEVEL SLICE REWRITE</text><text x="24" y="58" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="20" fill="#27162a" font-weight="600" text-anchor="start" opacity="1">The edited copy is deterministic</text><rect x="24" y="78" width="350" height="186" rx="12" fill="#fef7fc" stroke="#f7cbeb" stroke-width="1.1" opacity="1"/><text x="40" y="102" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">EDITED COPY</text><text x="40" y="128" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="15" fill="#27162a" font-weight="600" text-anchor="start" opacity="1">2 tensors · first 64 rows</text><text x="40" y="156" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#27162a" font-weight="400" text-anchor="start" opacity="1">q_proj.weight</text><text x="40" y="174" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">BF16 2048×1024 → 574ebe3b4fcb427b</text><text x="40" y="202" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#27162a" font-weight="400" text-anchor="start" opacity="1">down_proj.weight</text><text x="40" y="220" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">BF16 1024×3072 → b603bbfe2b46e3b9</text><text x="40" y="248" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#b35263" font-weight="400" text-anchor="start" opacity="1">311 tensors written</text><rect x="386" y="78" width="350" height="186" rx="12" fill="#fdf3fa" stroke="#b74595" stroke-width="1.3" opacity="1"/><text x="402" y="102" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">ONE BIT, NO RANDOMNESS</text><text x="402" y="136" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="19" fill="#b74595" font-weight="700" text-anchor="start" opacity="1">0x0080 flipped</text><text x="402" y="166" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11.5" fill="#27162a" font-weight="400" text-anchor="start" opacity="1">copy of the base directory</text><text x="402" y="190" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11.5" fill="#27162a" font-weight="400" text-anchor="start" opacity="1">raw BF16 words, not floats</text><text x="402" y="214" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11.5" fill="#b35263" font-weight="400" text-anchor="start" opacity="1">same input → same digest</text><text x="402" y="244" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">2 tensors · 64 rows each</text><text x="24" y="288" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">no float decode · no random numbers · the edit is a byte-level slice rewrite</text></svg>
