<svg xmlns="http://www.w3.org/2000/svg" width="520" height="820" viewBox="0 0 520 820" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" data-palette="e656bb-e76a7f-f1acf6-3561becb8244" role="img" aria-labelledby="process-mobile-light.svg-title process-mobile-light.svg-desc"><title id="process-mobile-light.svg-title">weightpatch process: two directories to one patch, then apply, revert and screen</title><desc id="process-mobile-light.svg-desc">diff compares a base and an edited safetensors directory as raw words and writes a sparse .wpatch with bounding-box slices and both digests; apply and revert replay or undo the slices with pre-image and post-image checks; screen maps the same patch onto a single-file GGUF by architecture and name map, reversing the ne order, and reports kept, missing or reshaped.</desc><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b74595"/><stop offset=".55" stop-color="#b35263"/><stop offset="1" stop-color="#8b638e"/></linearGradient><linearGradient id="cool" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b35263" stop-opacity=".30"/><stop offset="1" stop-color="#b74595" stop-opacity=".05"/></linearGradient><radialGradient id="halo"><stop stop-color="#b74595" stop-opacity="0.11"/><stop offset="1" stop-color="#b74595" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f7cbeb" stroke-opacity=".5" stroke-width=".7"/></pattern><filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#b74595" stroke-width="1.6"/></marker></defs><style>
.flow{stroke-dasharray:8 14;animation:flow 6s linear infinite}
.pulse{animation:pulse 5s ease-in-out infinite}
.trace{animation:trace 7s linear infinite}
@keyframes flow{to{stroke-dashoffset:-176}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes trace{0%{opacity:0}12%,88%{opacity:.65}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.flow,.pulse,.trace{animation:none}}
</style><rect width="520" height="820" rx="16" fill="#fef9fd"/><rect width="520" height="820" rx="16" fill="url(#grid)" opacity="0.8"/><ellipse cx="322.4" cy="295.2" rx="260" ry="492" fill="url(#halo)"/><text x="28" y="38" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">PROCESS / TWO DIRS TO ONE PATCH</text><text x="28" y="74" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="23" fill="#27162a" font-weight="400" text-anchor="start" opacity="1">One sparse patch,</text><text x="28" y="102" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="23" fill="#27162a" font-weight="400" text-anchor="start" opacity="1">replayed two ways</text><rect x="28" y="124" width="464" height="96" rx="12" fill="#fef7fc" stroke="#f7cbeb" stroke-width="1.1" opacity="1"/><text x="44" y="150" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#b74595" font-weight="600" text-anchor="start" opacity="1">Qwen3-0.6B</text><text x="44" y="176" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#27162a" font-weight="400" text-anchor="start" opacity="1">311 tensors · 1,503,300,328 bytes</text><text x="44" y="198" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">edited copy: 2 tensors · 64 rows</text><path d="M260 222L260 242" fill="none" stroke="#b74595" stroke-width="1.5" stroke-opacity="1" marker-end="url(#arrow)"/><rect x="28" y="248" width="464" height="82" rx="12" fill="#fef7fc" stroke="#f7cbeb" stroke-width="1.1" opacity="1"/><text x="44" y="274" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="17" fill="#b74595" font-weight="600" text-anchor="start" opacity="1">diff</text><text x="104" y="274" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11.5" fill="#27162a" font-weight="400" text-anchor="start" opacity="1">raw words · bbox · both digests</text><text x="44" y="300" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">2 changed · 309 unchanged · 0 added</text><path d="M260 332L260 352" fill="none" stroke="#b74595" stroke-width="1.5" stroke-opacity="1" marker-end="url(#arrow)"/><rect x="28" y="356" width="464" height="78" rx="12" fill="#fdf3fa" stroke="#b74595" stroke-width="1.3" opacity="1"/><text x="44" y="380" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">PATCH / .wpatch</text><text x="44" y="406" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#b74595" font-weight="700" text-anchor="start" opacity="1">d0722f8616bc · 838,693 bytes</text><text x="44" y="428" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">manifest.json · values.npz</text><path d="M260 436L260 454" fill="none" stroke="#b74595" stroke-width="1.5" stroke-opacity="1" marker-end="url(#arrow)"/><rect x="28" y="458" width="464" height="70" rx="12" fill="#fef7fc" stroke="#f7cbeb" stroke-width="1.1" opacity="1"/><text x="44" y="482" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">apply / revert · stack</text><text x="44" y="508" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="14" fill="#27162a" font-weight="600" text-anchor="start" opacity="1">rebuilt · back · ordered chain</text><text x="44" y="528" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">pre-image verified · revert byte-identical</text><path d="M260 530L260 550" fill="none" stroke="#b74595" stroke-width="1.5" stroke-opacity="1" marker-end="url(#arrow)"/><rect x="28" y="554" width="464" height="60" rx="12" fill="#fef7fc" stroke="#b35263" stroke-width="1.3" opacity="1"/><text x="44" y="578" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">SCREEN / GGUF · arch qwen3</text><text x="44" y="604" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#b35263" font-weight="600" text-anchor="start" opacity="1">2 kept · 0 missing · 0 reshaped</text><text x="28" y="650" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#b35263" font-weight="700" text-anchor="start" opacity="1">kept</text><text x="76" y="650" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">present, shape matches</text><text x="246" y="650" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#8b638e" font-weight="700" text-anchor="start" opacity="1">missing</text><text x="316" y="650" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">not found</text><text x="418" y="650" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#27162a" font-weight="700" text-anchor="start" opacity="1">reshaped</text><text x="28" y="676" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">packed or resized export</text><text x="28" y="730" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">screen compares presence and shape only</text><text x="28" y="754" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">GGUF is read-only in v0.1</text></svg>
