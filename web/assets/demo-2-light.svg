<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" data-palette="e656bb-e76a7f-f1acf6-3561becb8244" role="img" aria-labelledby="demo-2-light.svg-title demo-2-light.svg-desc"><title id="demo-2-light.svg-title">show reads the patch manifest</title><desc id="demo-2-light.svg-desc">show prints the patch path, the id d0722f8616bcfc05, a base of one file and 311 tensors, no parents, a declared probe with no claim, and two tensor edits with zero added or removed. The content id is re-derived from base, parents and edit and must match the stored manifest.</desc><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b74595"/><stop offset=".55" stop-color="#b35263"/><stop offset="1" stop-color="#8b638e"/></linearGradient><linearGradient id="cool" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b35263" stop-opacity=".30"/><stop offset="1" stop-color="#b74595" stop-opacity=".05"/></linearGradient><radialGradient id="halo"><stop stop-color="#b74595" stop-opacity="0.11"/><stop offset="1" stop-color="#b74595" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f7cbeb" stroke-opacity=".5" stroke-width=".7"/></pattern><filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#b74595" stroke-width="1.6"/></marker></defs><style>
.flow{stroke-dasharray:8 14;animation:flow 6s linear infinite}
.pulse{animation:pulse 5s ease-in-out infinite}
.trace{animation:trace 7s linear infinite}
@keyframes flow{to{stroke-dashoffset:-176}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes trace{0%{opacity:0}12%,88%{opacity:.65}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.flow,.pulse,.trace{animation:none}}
</style><rect width="760" height="300" rx="16" fill="#fef9fd"/><rect width="760" height="300" rx="16" fill="url(#grid)" opacity="0.8"/><ellipse cx="471.2" cy="108" rx="380" ry="180" fill="url(#halo)"/><text x="24" y="30" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">SHOW / SLICES, DIGESTS AND PROBE</text><text x="24" y="58" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="20" fill="#27162a" font-weight="600" text-anchor="start" opacity="1">show reads the manifest back</text><rect x="24" y="78" width="470" height="186" rx="12" fill="#fef7fc" stroke="#f7cbeb" stroke-width="1.1" opacity="1"/><text x="40" y="104" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">patch</text><text x="120" y="104" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#27162a" font-weight="400" text-anchor="start" opacity="1">qwen3-0.6b-neurons.wpatch</text><text x="40" y="128" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">id</text><text x="120" y="128" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#27162a" font-weight="400" text-anchor="start" opacity="1">d0722f8616bcfc05</text><text x="40" y="152" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">base</text><text x="120" y="152" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#27162a" font-weight="400" text-anchor="start" opacity="1">1 file(s) · 311 tensor(s)</text><text x="40" y="176" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">parents</text><text x="120" y="176" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#27162a" font-weight="400" text-anchor="start" opacity="1">-</text><text x="40" y="200" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">probe</text><text x="120" y="200" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#27162a" font-weight="400" text-anchor="start" opacity="1">declared · no claim</text><line x1="40" y1="226" x2="478" y2="226" stroke="#f7cbeb" stroke-width="1" stroke-opacity="1"/><text x="40" y="250" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#27162a" font-weight="400" text-anchor="start" opacity="1">2 tensor edit(s) · 0 added · 0 removed</text><rect x="510" y="78" width="226" height="186" rx="12" fill="#fdf3fa" stroke="#b74595" stroke-width="1.3" opacity="1"/><text x="528" y="102" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">THE ID IS RE-DERIVED</text><text x="528" y="134" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="17" fill="#b74595" font-weight="700" text-anchor="start" opacity="1">sha256</text><text x="528" y="156" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#27162a" font-weight="400" text-anchor="start" opacity="1">base</text><text x="528" y="176" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#27162a" font-weight="400" text-anchor="start" opacity="1">parents</text><text x="528" y="196" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#27162a" font-weight="400" text-anchor="start" opacity="1">edit</text><text x="528" y="228" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">a changed body is</text><text x="528" y="246" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#b35263" font-weight="400" text-anchor="start" opacity="1">refused on read</text><text x="24" y="288" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#725e7f" font-weight="400" text-anchor="start" opacity="1">probe is the author&#39;s declared claim; show prints it and never executes it</text></svg>
