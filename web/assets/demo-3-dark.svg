<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" data-palette="e656bb-e76a7f-f1acf6-3561becb8244" role="img" aria-labelledby="demo-3-dark.svg-title demo-3-dark.svg-desc"><title id="demo-3-dark.svg-title">apply checks pre-images and rewrites two tensors</title><desc id="demo-3-dark.svg-desc">apply compares the current digest of each touched tensor with the recorded before_sha256, copies the shards to rebuilt only after both match, writes the two recorded slices, re-opens the output and verifies the post-image digests. A mismatch exits before the output directory is created.</desc><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e656bb"/><stop offset=".55" stop-color="#e76a7f"/><stop offset="1" stop-color="#f1acf6"/></linearGradient><linearGradient id="cool" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e76a7f" stop-opacity=".30"/><stop offset="1" stop-color="#e656bb" stop-opacity=".05"/></linearGradient><radialGradient id="halo"><stop stop-color="#e656bb" stop-opacity="0.2"/><stop offset="1" stop-color="#e656bb" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3a1836" stroke-opacity=".5" stroke-width=".7"/></pattern><filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#e656bb" stroke-width="1.6"/></marker></defs><style>
.flow{stroke-dasharray:8 14;animation:flow 6s linear infinite}
.pulse{animation:pulse 5s ease-in-out infinite}
.trace{animation:trace 7s linear infinite}
@keyframes flow{to{stroke-dashoffset:-176}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes trace{0%{opacity:0}12%,88%{opacity:.65}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.flow,.pulse,.trace{animation:none}}
</style><rect width="760" height="300" rx="16" fill="#0a0710"/><rect width="760" height="300" rx="16" fill="url(#grid)" opacity="0.55"/><ellipse cx="471.2" cy="108" rx="380" ry="180" fill="url(#halo)"/><text x="24" y="30" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#b29cbc" font-weight="400" text-anchor="start" opacity="1">APPLY / PRE-IMAGE FIRST, POST-IMAGE AFTER</text><text x="24" y="58" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="20" fill="#fceefd" font-weight="600" text-anchor="start" opacity="1">apply verifies, then rewrites the slices</text><rect x="24" y="78" width="470" height="186" rx="12" fill="#13101c" stroke="#3a1836" stroke-width="1.1" opacity="1"/><text x="40" y="102" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#b29cbc" font-weight="400" text-anchor="start" opacity="1">PRE-IMAGE CHECK</text><text x="40" y="130" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#fceefd" font-weight="400" text-anchor="start" opacity="1">q_proj.weight</text><text x="220" y="130" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#e76a7f" font-weight="400" text-anchor="start" opacity="1">7592f6e7  match</text><text x="40" y="154" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#fceefd" font-weight="400" text-anchor="start" opacity="1">down_proj.weight</text><text x="220" y="154" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#e76a7f" font-weight="400" text-anchor="start" opacity="1">75228753  match</text><line x1="40" y1="172" x2="478" y2="172" stroke="#3a1836" stroke-width="1" stroke-opacity="1"/><text x="40" y="198" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11.5" fill="#fceefd" font-weight="400" text-anchor="start" opacity="1">copy shards → rebuilt</text><text x="40" y="222" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="11.5" fill="#b29cbc" font-weight="400" text-anchor="start" opacity="1">write the recorded slices</text><text x="40" y="248" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#b29cbc" font-weight="400" text-anchor="start" opacity="1">re-open · re-hash post-image</text><rect x="510" y="78" width="226" height="186" rx="12" fill="#140d1a" stroke="#e656bb" stroke-width="1.3" opacity="1"/><text x="528" y="102" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#b29cbc" font-weight="400" text-anchor="start" opacity="1">APPLIED</text><text x="528" y="132" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#e656bb" font-weight="700" text-anchor="start" opacity="1">d0722f8616bc</text><text x="528" y="158" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#fceefd" font-weight="400" text-anchor="start" opacity="1">→ rebuilt</text><text x="528" y="184" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#fceefd" font-weight="400" text-anchor="start" opacity="1">2 rewritten</text><text x="528" y="206" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5" fill="#e76a7f" font-weight="400" text-anchor="start" opacity="1">post-image verified</text><text x="24" y="288" font-family="'Space Grotesk', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" fill="#b29cbc" font-weight="400" text-anchor="start" opacity="1">a mismatched pre-image exits without creating the output directory</text></svg>
